openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
x-gateway:
  upstream: http://orders-service:8080
  prefix: /orders-api
  audience: 6f1c2e8a-0000-0000-0000-000000000000
components:
  securitySchemes:
    entra:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/tenant/v2.0/.well-known/openid-configuration
security:
  - entra: []
paths:
  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      x-gateway-authorization:
        all-of: [Orders.Read]
      responses:
        "200":
          description: One order.
    delete:
      x-gateway-authorization:
        all-of: [Orders.Read, Orders.Delete]
      responses:
        "204":
          description: Deleted.
  /orders/{id}/refund:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      x-gateway-authorization:
        any-of: [Orders.Refund, Finance.Admin]
      responses:
        "200":
          description: Refunded.
  /me:
    get:
      x-gateway-authorization:
        authenticated-only: true
      responses:
        "200":
          description: Me.
  /health:
    get:
      security: []
      responses:
        "200":
          description: Health.
