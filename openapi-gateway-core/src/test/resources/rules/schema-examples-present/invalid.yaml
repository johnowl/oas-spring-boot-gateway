openapi: 3.1.0
info:
  title: Orders
  version: 1.0.0
x-gateway:
  upstream: http://orders-service:8080
paths:
  /orders:
    get:
      security: []
      operationId: listOrders
      responses:
        # The referenced schema has no example. Examples on properties do not count.
        "200":
          description: The orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        # application/problem+json is a JSON media type.
        "404":
          description: Not found.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        # Empty values do not count.
        "409":
          description: Conflict.
          content:
            "Application/JSON; charset=utf-8":
              schema: { type: object, examples: [] }
              examples: {}
            application/vnd.orders+json:
              schema: { type: object }
              example: null
        # A response $ref: the pointer stays below the operation.
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      security: []
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { item: { type: string } } }
      responses:
        "201":
          description: Created.
  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      security: []
      operationId: replaceOrder
      # A request body $ref: the pointer stays below the operation.
      requestBody:
        $ref: "#/components/requestBodies/Order"
      responses:
        "200":
          description: OK.
components:
  requestBodies:
    Order:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Order" }
  responses:
    Unavailable:
      description: Unavailable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Order:
      type: object
      properties:
        id: { type: string, example: A-1001 }
    Problem:
      type: object
