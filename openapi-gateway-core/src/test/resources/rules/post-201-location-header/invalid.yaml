openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
x-gateway:
  upstream: http://orders-service:8080
paths:
  /orders:
    post:
      security: []
      operationId: createOrder
      responses:
        "201":
          description: Created.
  /payments:
    post:
      security: []
      operationId: createPayment
      responses:
        "201":
          description: Created.
          headers:
            Content-Location:
              schema: { type: string, format: uri }
  /invoices:
    post:
      security: []
      operationId: createInvoice
      responses:
        "201":
          $ref: "#/components/responses/Created"
components:
  responses:
    Created:
      description: Created, without a Location header.
