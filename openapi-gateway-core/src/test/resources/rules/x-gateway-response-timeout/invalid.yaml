openapi: 3.0.3
info:
  title: Reports
  version: 1.0.0
x-gateway:
  upstream: http://reports-service:8080
paths:
  /reports:
    get:
      x-gateway-response-timeout: 50
      responses:
        "200":
          description: The reports.
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      x-gateway-response-timeout: "500"
      responses:
        "204":
          description: Deleted.
