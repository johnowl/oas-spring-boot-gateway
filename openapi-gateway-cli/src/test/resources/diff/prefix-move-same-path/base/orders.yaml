openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
x-gateway:
  upstream: http://orders-service:8080
  prefix: /orders-api
  audience: 6f1c2e8a-0000-0000-0000-000000000000
components:
  securitySchemes:
    entra:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/tenant/v2.0/.well-known/openid-configuration
security:
  - entra: []
paths:
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      x-gateway-authorization:
        all-of: [Orders.Read, Orders.Delete]
      responses:
        "200":
          description: OK
